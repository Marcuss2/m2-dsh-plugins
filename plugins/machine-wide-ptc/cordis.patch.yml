# cordis.patch.yml — DSH home-level patch layer.
#
# Verbatim artifact: this file is copied to `$DSH_HOME/cordis.patch.yml` (the
# launcher reads it for EVERY profile, applying it after that profile's bundle
# layers and own patch list, before explicit `--patch` overlays). One file
# therefore turns on builtin Code Mode (PTC — programmatic tool calling)
# machine-wide instead of per session.
#
# What the row does:
#
#   id: tools → mode: both
#     The deployment default presentation for every agent that declares none
#     (shipped `dsh-tools`). Three modes exist; two matter here:
#     (shipped `dsh-tools`). Two modes matter here:
#       `code`  collapses the model-facing surface to the reserved `run_code`
#               transport plus a generated TypeScript SDK; the model writes one
#               program calling `await tools.<name>({...})` instead of one round
#               trip per call. Direct native calls naming any other tool resolve
#               to UNKNOWN_TOOL before policy runs — announced surface ==
#               callable surface. Forces EVERYTHING through run_code.
#       `both`  keeps the native per-tool schemas AND exposes `run_code`. The model
#               picks either path per step. Costs more fixed prompt tokens than
#               `code` and is the mode this kit now runs: it lets a program drive
#               the SDK while still allowing direct single tool calls. Caveat:
#               dsh-ptc-plus registers `edit_run_code` only under `code`, so `both`
#               buys native calls at the price of the in-place cell-repair transport.
#     `native` (no run_code at all) is the incompatible one: dsh-ptc-plus
#     assembles as native-only, so `both` is the widest surface that keeps the
#     REPL plugin happy (see plugins/dsh-ptc-plus/README.md).

#     This outranks the TEMPORARY `DSH_TOOLS_MODE` env seam that
#     `@deepseek-ai/dsh-web-app` puts on the same row (its value is evaluated
#     in a lower layer).
#
#   The `code-runtime` provider row is deliberately NOT inserted here.
#     Non-native modes require a `ctx.codeRuntime` provider with a registered
#     SDK renderer. In dsh 0.1.1-rc.2 an `insert:` in this layer is
#     concatenated onto the composed entry list (`dsh-app-boot`
#     `applyEntryPatches`), and the loader throws `duplicate loader entry id:
#     code-runtime` because BOTH shipped surface bundles already insert the
#     identical row — `@deepseek-ai/dsh-web-app/cordis.patch.yml` and
#     `@deepseek-ai/dsh-headless/cordis.patch.yml`. Rows are keyed by id only
#     for override patches, not for inserts. Any profile built on either of
#     those bundles (i.e. every stock profile) gets the worker from its
#     bundle. A CUSTOM profile that mounts neither bundle MUST insert
#     `- id: code-runtime
#        name: '@deepseek-ai/dsh-code-runtime-worker-thread'`
#     in its OWN cordis.patch.yml (or mount `dsh-headless`), otherwise prompt
#     assembly fails loudly in non-native modes.
#
# Approvals are NOT bypassed: every SDK binding call re-enters the full
# pre-execute → guards → execute → post-execute pipeline, so `ask` policies
# still gate risky tools — just mid-program.
#
# Takes effect when the profile process (re)boots: bundle/config layers
# compose at start, running sessions keep their tools until then.

- id: tools
  config:
    mode: both
