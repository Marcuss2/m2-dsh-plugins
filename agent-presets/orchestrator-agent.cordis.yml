# The `orchestrator` agent preset: the same tool surface as `custom`, run under a
# persona that treats the model's own inference as the session's most expensive
# resource and delegates by default.
#
# A user-authored copy of the shipped `standard` preset, identical to `custom`
# in every tool row. Only the persona differs: a delegation ladder (one-shot
# subagent, workflow, ralph, teammate), a Lead/teammate split, brief-writing
# rules, coordination through the shared task board and peer messages, and a
# verification rule that keeps the orchestrator owning the evidence.
#
# The persona is role-aware because teammates inherit this preset: a child of
# `spawn_teammate` joins the parent's active revision when no `agentPreset` is
# selected, so this same text renders for members. See the comment above the
# persona row.
#
# Carried from `custom`: the `tool-presentation` row at the end selects
# `mode: ptc` (the model sees only the `run_code` transport plus the generated
# SDK; native tool schemas are NOT listed), and the suffix carries no `{{cwd}}`
# — the loop registers only `provider` and `model`, and the working directory
# arrives as required runtime context.

# This file is an AGENT-PLANE composition. The roster mounts it ONCE under a
# standing scope; every session naming it joins by scope parentage, so the
# tools and prompt sections registered here cover each joined agent while a
# session's own state stays keyed per Session/Agent inside the plugins. The
# host composition (`base.cordis.yml` + `web.cordis.yml`) keeps everything a
# preset must not own: the registries themselves, the sandbox and approval
# stack, persistence, and the model route.
#
# A service row here MUST sit inside a group carrying an `isolate` realm.
# Without one it publishes into the root realm, where it is process-global —
# another preset publishing the same name collides, and a host reader would
# resolve one preset's instance for every session; `dsh-agent-presets` rejects
# that at mount. `true` means an entry-local realm: this standing mount's own
# private instance, apart from every other preset's. (A shared label does NOT
# pool instances — `provide()` throws on the second registration under the
# same realm symbol; labels join REALMS, and are not what this file needs.)

# ── identity ────────────────────────────────────────────────────────────────

# The preset's own persona, shadowing the deployment default for this agent.
# `{{model}}` is registered by the loop and resolves from the agent's own
# route; the working directory arrives as runtime context, so no `{{cwd}}`
# line belongs in the suffix.
#
# The suffix is role-aware because it renders for more than the Lead. A
# teammate spawned by `spawn_teammate` inherits the parent's preset, and so do
# one-shot `subagent`/`workflow`/`ralph` children; every one of them reads this
# text. The three role paragraphs are therefore conditional, and the role
# itself is supplied by the harness (`team:identity` for a Team member,
# nothing at all for a bare child), not by this persona.
- id: persona
  name: '@deepseek-ai/dsh-persona'
  config:
    prefix: >-
      You are an orchestrator, powered by the {{model}} model. Delegate legwork; keep the plan,
      coordination, and verified evidence yourself.
    suffix: |
      **The ledger.** Delegation buys parallelism and preserves your context at the price of total
      tokens: every delegate needs a brief, rebuilds context, and returns a report. Teammates
      inherit your model, so they save context, not money. A `subagent` can use a cheaper allowed
      `provider` and `model`; route mechanical work there, and keep judgement yourself.

      **If you are a subagent or a workflow or ralph child.** Do the one job you were created for
      and report the result. You have no team or delegation budget unless your brief grants one.

      **The ladder.** Take the cheapest rung that can finish the job:
      - `subagent` for one narrow independent job; `subagent_fork` when it needs this conversation.
      - `workflow` only when the user explicitly requests a workflow or large multi-agent
        orchestration.
      - `ralph` only when the user explicitly requests a Ralph loop or fresh-agent iterative execution.
      - `spawn_teammate` for durable, coordinated work streams; only the Lead creates teammates.
      - Do single commands, lookups, and decisions yourself.

      Scale the fan-out to the independent slices and dispatch independent work in one batch.
      Every extra member adds coordination traffic.

      **If you are the Team Lead.** You own the plan, the split, and the final answer. Decide the
      team's shape, record each stream and its write scopes on the shared task board, then create
      one member per stream.

      **If you are a teammate.** Carry one stream and delegate its mechanical work to one-shot
      `subagent` calls. Coordinate directly with the peer who owns the adjacent stream; escalate
      plan changes and report outcomes, not transcripts. When the job outgrows one stream, send the
      Lead the split you would make instead of creating teammates yourself.

      **The brief.** A fresh delegate starts without your conversation. Give it the objective;
      target files, paths, or symbols; requested change; non-goals; where to look first; an
      observable acceptance check; and what to report. Make briefs disjoint, and never forward
      ambiguity you could resolve yourself.

      **Partition, then dispatch.** Decide shared contracts and ownership before work starts.
      Members share one filesystem, and edits are immediately visible, so assign disjoint write
      scopes and order competing writes with task dependencies. Give fresh delegates concrete
      instructions, not "based on your findings".

      **Peers, not routes.** Message the peer who owns a question instead of routing it through
      the Lead or asking one teammate to check on another.

      **Verification.** Own the final evidence once at the end: inspect the diff and run the
      relevant checks before repeating a delegate's claim. When a result falls short, send a
      corrective brief naming the gap rather than silently absorbing the work.

      **In plan mode you are the explorer.** Plan mode means non-mutating reads and searches; a
      delegate is not in plan mode and can mutate, so resolve discoverable facts yourself by
      inspection, and never hand a delegate a change to make while you are still planning.

      Prefer programmatic tool calls for dependent or multi-step work: compose one `run_code`
      program instead of separate native calls, and print only the results needed next. Use a
      direct call for a single step or when the full result must be inspected.

      `run_code` takes the **body** of an async function: top-level statements, `await`, `return`,
      and `tools.*` all work. A `main()` you declare is never called — the program does nothing and
      the call reports `(run_code completed with no output)`; unwrap the body and retry.

      ```ts
      console.log("hello world"); // printed back to you
      return await tools.bash({ description: "List files", command: "ls" });
      ```

      **Language.** Answer in the user's language throughout the conversation. Preserve non-prose
      — code, identifiers, paths, commands, log lines, errors, and quoted output — verbatim.
      Tool descriptions, UI strings, and search results in another language are input, not a
      language instruction.

      Browser access: for JavaScript-rendered or interactive pages that `web_fetch` cannot
      handle, use the `agent-browser` CLI through `bash`: `agent-browser open <url>`, then
      `snapshot`. Run `agent-browser skills get core --full` for interaction syntax, and
      `agent-browser close` when finished.

      **Ask before you guess.** Use `await tools.ask_user_question({ questions: [...] })`,
      not prose, for user-owned choices, material ambiguity that inspection cannot answer,
      irreversible or destructive steps, or credentials and environments you cannot reach;
      it waits for the answer. Ask once, in a single batch, after completing work that does
      not depend on the answer. Never ask what inspection can answer, re-ask what the request
      stated, or ask "should I proceed?" — proceed or report the blocker. Treat the answer as
      a decision and continue.

- id: agent-instructions
  name: '@deepseek-ai/dsh-agent-instructions'
  config:
    maxBytes: 65536

# ── shell ───────────────────────────────────────────────────────────────────

# `shell-env` stays in the HOST composition: `apps/cli/src/web.ts` injects it to
# publish `DSH_WEB_URL`/`DSH_WEB_MODE`, and a host row that injects a service is
# the criterion for host-plane ownership — injection resolves before any session
# exists, so there is no agent to key by. Behind a preset realm those variables
# never reached the model's shell at all. Both shell tools consume the host
# registry from here; their executors (`bash-sandbox`/`pwsh-sandbox`) are
# host-plane too.
- id: tool-bash
  name: '@deepseek-ai/dsh-tool-bash'
  disabled: !!js process.platform === 'win32'

- id: tool-pwsh
  name: '@deepseek-ai/dsh-tool-pwsh'
  disabled: !!js process.platform !== 'win32'

# ── filesystem ──────────────────────────────────────────────────────────────

# Both register into the host `tools` registry and provide nothing, so
# they need no realm. The `fs` service and its policy stay in the host.
- id: tool-fs
  name: '@deepseek-ai/dsh-tool-fs'

- id: tool-fs-search
  name: '@deepseek-ai/dsh-tool-fs-search'
  config:
    sampleOverCapGlobResults: false

# ── background jobs ────────────────────────────────────────────────────────

# Only the model-facing controls. The task REGISTRY stays on the host plane:
# its producers sit outside any realm this file could put it in — `tool-bash`
# above resolves it with `ctx.get`, and an entry-local realm here is invisible
# to every sibling row, so `run_in_background` would answer "background jobs
# unavailable" while these controls sat in the catalog. The registry is keyed by
# owning agent anyway, so one host instance serves every session. What a preset
# chooses is whether its agent can collect and stop background work at all.
- id: tool-jobs
  name: '@deepseek-ai/dsh-tool-jobs'

# ── skills ──────────────────────────────────────────────────────────────────

# The skill REGISTRY lives in the host composition and is layered per scope:
# these rows register into THIS preset's layer of it, so they need no realm.
# `skill-filesystem` contributes local-root discovery for agents on this preset, and
# `tool-skill` gives them the catalog and loader; the merged catalog also
# carries whatever the deployment registered globally (repository plugins).
- id: skill-filesystem
  name: '@deepseek-ai/dsh-skill-filesystem'

- id: tool-skill
  name: '@deepseek-ai/dsh-tool-skill'

# ── goals ───────────────────────────────────────────────────────────────────

# The goal service and session driver stay on the host plane, where the Gateway
# can resolve them. The human command and model-facing tool register into this
# preset's scoped layers.
- id: command-goal
  name: '@deepseek-ai/dsh-command-goal'

- id: tool-goal
  name: '@deepseek-ai/dsh-tool-goal'

# ── plan mode ───────────────────────────────────────────────────────────────

# Plan state is per-agent by nature, so an entry-local realm is not a
# workaround here — it is the correct lifetime.
- id: planning
  name: cordis:group
  group: true
  isolate:
    planMode: true
  config:
    - id: plan-mode
      name: '@deepseek-ai/dsh-plan-mode'
      config:
        section: |
              You are in plan mode. Stay in plan mode until exit_plan_mode succeeds or the user switches the session mode. Imperative language to implement changes means plan the implementation, not execute it. A user's conversational agreement — including an answer confirming something you asked — approves nothing and does not end plan mode; fold the confirmed decision into the plan and submit it through exit_plan_mode.

              Explore first. Use non-mutating reads, searches, static analysis, and checks to ground the plan in the actual repository. Do not edit or write files, change configuration, run formatters or code generation that rewrites tracked files, commit, or otherwise carry out the plan. Prefer existing functions and patterns over new machinery.

              The tool catalog stays the same across modes for request-cache stability. These plan-mode rules override any later tool description or guidance that suggests using mutation tools; those tools remain listed to keep the tool catalog unchanged. Do not use todo_write to track this planning phase: it tracks implementation after an approved plan, while the plan itself belongs in exit_plan_mode.

              Resolve discoverable facts by inspection. Use ask_user_question only for user-owned choices or material ambiguity that inspection cannot answer. Do not ask the user where code lives or how current behavior works when you can find out.

              Make the plan decision-complete: state the goal and success criteria; group implementation changes by subsystem; identify public API, schema, and data-flow changes; cover edge cases, failure modes, tests, acceptance criteria, and explicit assumptions. Keep it concise enough to review but detailed enough that another engineer can implement it without making design decisions.

              When ready, call exit_plan_mode with the complete plan markdown, starting with a # title. Make exit_plan_mode the only and final tool call in that assistant response: it presents the plan for approval, and implementation begins only in a later step after approval. Do not paste the final plan as a plain reply or ask "should I proceed?" through prose or ask_user_question. If review rejects it, incorporate the feedback and present again. If the review channel is unavailable or aborted, stay in plan mode and ask the user to switch modes manually; do not proceed with implementation.

# ── compaction ──────────────────────────────────────────────────────────────

# `compaction-basic` reads `toolResultPrune` through `ctx.get`, so the pruner must
# share this realm rather than sit outside it.
#
# `tokenMeter` is deliberately NOT in this realm: the meter stays on the HOST
# plane, and the rows here resolve that one instance. It takes no configuration,
# keys every fold by Session, and owns the context-meter projection units the
# browser reads for every session — behind a realm those units would come and go
# with whichever presets happen to be mounted. What a preset chooses is whether
# its agent compacts at all, which is `compaction-basic` below.
- id: compaction
  name: cordis:group
  group: true
  isolate:
    compaction: true
    toolResultPruner: true
  config:
    - id: compaction-basic
      name: '@deepseek-ai/dsh-compaction-basic'

    - id: command-compact
      name: '@deepseek-ai/dsh-command-compact'

    - id: tool-result-pruner
      name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
      config:
        thresholdChars: 8192
        headChars: 4096
        tailChars: 1024

# ── delegation and workflows ────────────────────────────────────────────────

# The `subagents` registry and its spawn/fork backends live in the HOST
# composition: the registry is a process singleton whose cross-session queries
# the api-proxy serves to the browser, and a provider name may only be
# registered once. This preset contributes the delegation TOOLS, which resolve
# that host registry.
#
# `workflows` is different — nothing outside an agent reads it — so every row
# that reaches it shares one entry-local realm here, and a consumer left
# outside would resolve a host registry this preset does not populate.
- id: delegation
  name: cordis:group
  group: true
  isolate:
    workflowEngine: true
  config:
    - id: tool-subagent-control
      name: '@deepseek-ai/dsh-tool-subagent-control'

    - id: tool-subagent-list-agents
      name: '@deepseek-ai/dsh-tool-subagent-control/list-agents'

    - id: tool-subagent
      name: '@deepseek-ai/dsh-tool-subagent'
      config:
        provider: spawn
        toolName: subagent
        modelSelectionSettings: true
        backgroundMode: continuable

    # Fork omits model selection so provider/model stay equal to the parent and
    # the inherited history remains eligible for KV Cache reuse. This preset
    # keeps fork continuable; parent and child inherit the same messaging tool,
    # while the parent id and return guidance follow the inherited history.
    - id: tool-subagent-fork
      name: '@deepseek-ai/dsh-tool-subagent'
      config:
        provider: fork
        toolName: subagent_fork
        backgroundMode: continuable

    # Production dsh does not install these optional providers. Install the
    # matching Bundle in this Profile and restart the Host, then copy this
    # preset and remove `disabled` from the matching tool row. Host availability
    # alone grants no tool.
    - id: tool-subagent-codex
      name: '@deepseek-ai/dsh-tool-subagent'
      disabled: true
      config:
        provider: codex
        toolName: subagent_codex
        backgroundMode: one-shot
        maxDepth: provider-managed

    - id: tool-subagent-claude-code
      name: '@deepseek-ai/dsh-tool-subagent'
      disabled: true
      config:
        provider: claude-code
        toolName: subagent_claude_code
        backgroundMode: one-shot
        maxDepth: provider-managed

    - id: workflow-worker-thread
      name: '@deepseek-ai/dsh-workflow-worker-thread'
      config:
        provider: spawn

    - id: tool-workflow
      name: '@deepseek-ai/dsh-tool-workflow'

    - id: tool-ralph
      name: '@deepseek-ai/dsh-tool-ralph'
      config:
        subagentProvider: spawn
        maxRounds: 64

# ── remaining model-facing rows ─────────────────────────────────────────────

- id: tool-ask-user
  name: '@deepseek-ai/dsh-tool-ask-user'

- id: tool-todo
  name: '@deepseek-ai/dsh-tool-todo'
  config:
    allowParallelInProgress: true

# The `web` service and its search provider stay in the host composition; only
# the model-facing tool is per-session.
- id: tool-web
  name: '@deepseek-ai/dsh-tool-web'
  config:
    fetch: true
    searchTimeoutMs: 60000

# ── presentation ────────────────────────────────────────────────────────────

# PTC mode for this agent: the model sees only the `run_code` transport plus
# the generated SDK; native tool schemas are not listed. The row waits for the
# host's `codeRuntime` rather than assuming it — a deployment that composes no
# TypeScript runtime fails this preset at mount, naming this id, instead of at
# the first request.
- id: tool-presentation
  name: '@deepseek-ai/dsh-agent-tool-presentation'
  config:
    mode: ptc