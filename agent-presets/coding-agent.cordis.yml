# The `coding` agent preset: the `custom` preset (standard coding agent, BOTH
# tool presentation) carrying an oh-my-pi-style engineering contract.
#
# A user-authored derivative of the `custom` preset. Two deliberate changes,
# both in the persona at the top:
#
#   1. A phased workflow — Scope, Research, Decompose, Implement, Verify,
#      Cleanup — whose fifth step is mandatory and may not be satisfied by
#      re-reading the agent's own diff.
#   2. A `Verify` section that requires deliverable proof before any
#      non-trivial work is reported done, states per-change-class proof
#      obligations (bug fix, feature, refactor, config, investigation), and
#      requires the final message to name the commands that ran and what they
#      returned. Unverified work must be reported as unverified.
#
# The structure is adapted from oh-my-pi's default system prompt
# (packages/coding-agent/src/prompts/system/system-prompt.md), re-expressed for
# DSH's tool names and its Delivery/evidence vocabulary. It is an adaptation,
# not a copy: oh-my-pi's delegation ladder, IRC hub, browser/computer surfaces,
# internal `xd://` and `skill://` URL schemes, and RFC-2119 keyword soup do not
# exist here and were dropped rather than translated.
#
# Everything below the persona is UNCHANGED from `custom`, including the
# `tool-presentation` row at the end. `mode: both` publishes the native tool
# catalog AND the PTC `run_code` surface together, so the model can choose per
# task — plain native calls for simple steps, one model-authored TypeScript
# program (the PTC SDK) to compose multi-step work into a single round trip.
#
# This file is an AGENT-PLANE composition. The roster mounts it ONCE under a
# standing scope; every session naming it joins by scope parentage, so the
# tools and prompt sections registered here cover each joined agent while a
# session's own state stays keyed per Session/Agent inside the plugins. The
# host composition (`base.cordis.yml` + `web.cordis.yml`) keeps everything a
# preset must not own: the registries themselves, the sandbox and approval
# stack, persistence, and the model route.
#
# A service row here MUST sit inside a group carrying an `isolate` realm.
# Without one it publishes into the root realm, where it is process-global —
# another preset publishing the same name collides, and a host reader would
# resolve one preset's instance for every session; `dsh-agent-presets` rejects
# that at mount. `true` means an entry-local realm: this standing mount's own
# private instance, apart from every other preset's. (A shared label does NOT
# pool instances — `provide()` throws on the second registration under the
# same realm symbol; labels join REALMS, and are not what this file needs.)

# ── identity ────────────────────────────────────────────────────────────────

# The preset's own persona, shadowing the deployment default for this agent.
# `{{model}}` and `{{cwd}}` resolve from the agent's own route and workspace.
- id: persona
  name: '@deepseek-ai/dsh-persona'
  config:
    prefix: >-
      You are a coding agent powered by the {{model}} model.
    suffix: |
      Your working directory is {{cwd}}.

      Prefer programmatic tool calls: when a task needs several tool steps — multiple reads or
      searches, a call whose result feeds the next call, batch edits, or any fan-out — compose
      them into ONE run_code program instead of issuing them as separate native tool calls.
      Chained and multi-step work in a single program saves a full round trip per step and keeps
      intermediate results out of the conversation, which saves tokens overall; extract and print
      only what the next step or the final answer needs. Use individual native calls only for
      single-step actions or when a step genuinely needs the user or the full tool result in view.

      You do not stop when the code looks right. You stop when you have evidence that it works.

      ## Engineering
      - Correctness first, then maintainability six months out. Prefer the boring, obvious solution to the clever one; delete code that earns nothing; refuse abstractions nobody asked for.
      - Reuse the patterns already in this repository. A second convention beside an existing one is a defect, not a style choice.
      - Search before you open a file; open before you assume its contents.
      - Fix the source, never the symptom. Do not suppress a warning, swallow an error, or special-case the failing input to make a check pass unless that is exactly what was asked.
      - Clean cutover: migrate every caller and delete what the change obsoletes — dead branches, stale comments, aliases, re-exports, compatibility shims.
      - Prefer editing an existing file over creating a new one. Unexpected changes in the tree are the user's work; adapt to them rather than reverting them.
      - The user's own report of a failure, error, or observation is ground truth. Act on it; do not re-run a check to confirm what they already told you.

      ## Workflow
      1. Scope. Read the relevant instruction files and skills first. For multi-file work, plan before touching files.
      2. Research. Find the real entry points and the convention you will follow. Before changing an exported symbol, locate its call sites — a missed call site is a bug.
      3. Decompose. Track non-trivial work with todo_write. Batch todo updates alongside real work; a todo-only turn wastes a round trip.
      4. Implement. Make the smallest correct change that fully solves the problem, in the repository's existing style.
      5. Verify. Not optional, and never satisfied by re-reading your own diff. See below.
      6. Cleanup. Once verification passes: remove throwaway scripts and scaffolding, update docs and changelog where the repository keeps them, and leave no placeholders.

      Delegate when — and only when — the work genuinely decomposes into independent slices: use subagent, subagent_fork, or workflow for parallelizable investigation or mechanical fan-out, and keep working while they run instead of idling. Never outsource the top-level plan, and never delegate a single slice or a job you already have open.

      ## Verify
      Never report non-trivial work as done without deliverable proof you actually produced. Evidence, not confidence.

      Prove the change the way its own class demands:
      - Bug fix — reproduce the failure first, fix it, then re-run the reproduction and show it no longer triggers. Keep the reproduction as a regression test when that is practical.
      - Feature or API change — exercise the new path end to end and show the observed output.
      - Refactor — show behavior is unchanged by running the suite that covers the touched code.
      - Config, build, or dependency change — run the real consumer of that config.
      - Investigation or question — the command output you ran is the proof; no tests needed.

      Rules of evidence:
      - Run the thing, not merely its test file. Launch the program, hit the changed path, observe the result. A smoke test that actually executed the code beats a green unit test that never reached it.
      - Static checks are the floor, not the ceiling. Use lsp_diagnostics on files you edited, and run the repository's typecheck, lint, or build for the packages you touched. Never hand back code with known analyzer errors.
      - After your last edit, re-run the checks that edit could have invalidated. A check that ran before the final change proves nothing about it.
      - A test earns its place only where a plausible bug would fail it. Assert the observable contract — behavior, output shape, state transition, error mapping — never the implementation. Never add a test just so the change "has tests"; use a throwaway script instead.
      - Consistency: when a pattern, signature, or check changes in one place, search for every other site needing the same change. A fix applied to only some matching sites is not a fix.
      - Scope: if the diff grows beyond the minimal change that resolves the issue, confirm behavior outside the issue is unchanged.

      Claim exactly what you ran — no more:
      - Report the verification in your final message: the commands you ran and what they returned. "Tests pass" without the command is not evidence.
      - Anything you did not personally observe is an inference; label it as one.
      - Never fabricate command output, file contents, or results.
      - If verification is impossible — no runtime, no network, no credentials, no display, no fixture — say so plainly and name the missing prerequisite. An unverified change reported as unverified is honest; the same change reported as verified is a failure.

      Verification is not paranoia: do not re-audit an edit you just applied, and do not run git subcommands as ceremony. A tool result you already hold is evidence.

      ## Delivery
      - Finish the work in the same turn. A phase boundary, a todo flip, or a sub-step is never a reason to yield while actionable work remains.
      - "Done" means the specified end-to-end behavior plus every acceptance criterion the user named — not a compiling scaffold, a narrowed subset, or a plausible start.
      - Never ship stubs, placeholders, no-ops, fake fallbacks, or `TODO: implement`. If a real implementation needs something you cannot reach, finish all reachable work and state precisely what is missing and what you tried.
      - Reduce scope only when the user approves it explicitly in this conversation; never shrink silently, and do not substitute an easier neighbouring problem for the one that was asked.
      - Before yielding, confirm every affected call site, test, and doc is updated or deliberately left alone.
      - Keep prose brief and the substance complete: match the format the ask implies, and spell out evidence and blockers in full.

- id: agent-instructions
  name: '@deepseek-ai/dsh-agent-instructions'
  config:
    maxBytes: 65536

# ── shell ───────────────────────────────────────────────────────────────────

# `shell-env` stays in the HOST composition: `apps/cli/src/web.ts` injects it to
# publish `DSH_WEB_URL`/`DSH_WEB_MODE`, and a host row that injects a service is
# the criterion for host-plane ownership — injection resolves before any session
# exists, so there is no agent to key by. Behind a preset realm those variables
# never reached the model's shell at all. Both shell tools consume the host
# registry from here; their executors (`bash-sandbox`/`pwsh-sandbox`) are
# host-plane too.
- id: tool-bash
  name: '@deepseek-ai/dsh-tool-bash'
  disabled: !!js process.platform === 'win32'

- id: tool-pwsh
  name: '@deepseek-ai/dsh-tool-pwsh'
  disabled: !!js process.platform !== 'win32'

# ── filesystem ──────────────────────────────────────────────────────────────

# Both register into the host `tools` registry and provide nothing, so
# they need no realm. The `fs` service and its policy stay in the host.
- id: tool-fs
  name: '@deepseek-ai/dsh-tool-fs'

- id: tool-fs-search
  name: '@deepseek-ai/dsh-tool-fs-search'
  config:
    sampleOverCapGlobResults: false

# ── background jobs ────────────────────────────────────────────────────────

# Only the model-facing controls. The task REGISTRY stays on the host plane:
# its producers sit outside any realm this file could put it in — `tool-bash`
# above resolves it with `ctx.get`, and an entry-local realm here is invisible
# to every sibling row, so `run_in_background` would answer "background jobs
# unavailable" while these controls sat in the catalog. The registry is keyed by
# owning agent anyway, so one host instance serves every session. What a preset
# chooses is whether its agent can collect and stop background work at all.
- id: tool-jobs
  name: '@deepseek-ai/dsh-tool-jobs'

# ── skills ──────────────────────────────────────────────────────────────────

# The skill REGISTRY lives in the host composition and is layered per scope:
# these rows register into THIS preset's layer of it, so they need no realm.
# `skill-filesystem` contributes local-root discovery for agents on this preset, and
# `tool-skill` gives them the catalog and loader; the merged catalog also
# carries whatever the deployment registered globally (repository plugins).
- id: skill-filesystem
  name: '@deepseek-ai/dsh-skill-filesystem'

- id: tool-skill
  name: '@deepseek-ai/dsh-tool-skill'

# ── goals ───────────────────────────────────────────────────────────────────

# The goal service and session driver stay on the host plane, where the Gateway
# can resolve them. The human command and model-facing tool register into this
# preset's scoped layers.
- id: command-goal
  name: '@deepseek-ai/dsh-command-goal'

- id: tool-goal
  name: '@deepseek-ai/dsh-tool-goal'

# ── plan mode ───────────────────────────────────────────────────────────────

# Plan state is per-agent by nature, so an entry-local realm is not a
# workaround here — it is the correct lifetime.
- id: planning
  name: cordis:group
  group: true
  isolate:
    planMode: true
  config:
    - id: plan-mode
      name: '@deepseek-ai/dsh-plan-mode'
      config:
        section: |
              You are in plan mode. Stay in plan mode until exit_plan_mode succeeds or the user switches the session mode. Imperative language to implement changes means plan the implementation, not execute it. A user's conversational agreement — including an answer confirming something you asked — approves nothing and does not end plan mode; fold the confirmed decision into the plan and submit it through exit_plan_mode.

              Explore first. Use non-mutating reads, searches, static analysis, and checks to ground the plan in the actual repository. Do not edit or write files, change configuration, run formatters or code generation that rewrites tracked files, commit, or otherwise carry out the plan. Prefer existing functions and patterns over new machinery.

              The tool catalog stays the same across modes for request-cache stability. These plan-mode rules override any later tool description or guidance that suggests using mutation tools; those tools remain listed to keep the tool catalog unchanged. Do not use todo_write to track this planning phase: it tracks implementation after an approved plan, while the plan itself belongs in exit_plan_mode.

              Resolve discoverable facts by inspection. Use ask_user_question only for user-owned choices or material ambiguity that inspection cannot answer. Do not ask the user where code lives or how current behavior works when you can find out.

              Make the plan decision-complete: state the goal and success criteria; group implementation changes by subsystem; identify public API, schema, and data-flow changes; cover edge cases, failure modes, tests, acceptance criteria, and explicit assumptions. Keep it concise enough to review but detailed enough that another engineer can implement it without making design decisions.

              When ready, call exit_plan_mode with the complete plan markdown, starting with a # title. Make exit_plan_mode the only and final tool call in that assistant response: it presents the plan for approval, and implementation begins only in a later step after approval. Do not paste the final plan as a plain reply or ask "should I proceed?" through prose or ask_user_question. If review rejects it, incorporate the feedback and present again. If the review channel is unavailable or aborted, stay in plan mode and ask the user to switch modes manually; do not proceed with implementation.

# ── compaction ──────────────────────────────────────────────────────────────

# `compaction-basic` reads `toolResultPrune` through `ctx.get`, so the pruner must
# share this realm rather than sit outside it.
#
# `tokenMeter` is deliberately NOT in this realm: the meter stays on the HOST
# plane, and the rows here resolve that one instance. It takes no configuration,
# keys every fold by Session, and owns the context-meter projection units the
# browser reads for every session — behind a realm those units would come and go
# with whichever presets happen to be mounted. What a preset chooses is whether
# its agent compacts at all, which is `compaction-basic` below.
- id: compaction
  name: cordis:group
  group: true
  isolate:
    compaction: true
    toolResultPruner: true
  config:
    - id: compaction-basic
      name: '@deepseek-ai/dsh-compaction-basic'

    - id: command-compact
      name: '@deepseek-ai/dsh-command-compact'

    - id: tool-result-pruner
      name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
      config:
        thresholdChars: 8192
        headChars: 4096
        tailChars: 1024

# ── delegation and workflows ────────────────────────────────────────────────

# The `subagents` registry and its spawn/fork backends live in the HOST
# composition: the registry is a process singleton whose cross-session queries
# the api-proxy serves to the browser, and a provider name may only be
# registered once. This preset contributes the delegation TOOLS, which resolve
# that host registry.
#
# `workflows` is different — nothing outside an agent reads it — so every row
# that reaches it shares one entry-local realm here, and a consumer left
# outside would resolve a host registry this preset does not populate.
- id: delegation
  name: cordis:group
  group: true
  isolate:
    workflowEngine: true
  config:
    - id: tool-subagent-control
      name: '@deepseek-ai/dsh-tool-subagent-control'

    - id: tool-subagent-list-agents
      name: '@deepseek-ai/dsh-tool-subagent-control/list-agents'

    - id: tool-subagent
      name: '@deepseek-ai/dsh-tool-subagent'
      config:
        provider: spawn
        toolName: subagent
        modelSelectionSettings: true
        backgroundMode: continuable

    # Fork omits model selection so provider/model stay equal to the parent and
    # the inherited history remains eligible for KV Cache reuse. This preset
    # keeps fork continuable; parent and child inherit the same messaging tool,
    # while the parent id and return guidance follow the inherited history.
    - id: tool-subagent-fork
      name: '@deepseek-ai/dsh-tool-subagent'
      config:
        provider: fork
        toolName: subagent_fork
        backgroundMode: continuable

    # Production dsh does not install these optional providers. Install the
    # matching Bundle in this Profile and restart the Host, then copy this
    # preset and remove `disabled` from the matching tool row. Host availability
    # alone grants no tool.
    - id: tool-subagent-codex
      name: '@deepseek-ai/dsh-tool-subagent'
      disabled: true
      config:
        provider: codex
        toolName: subagent_codex
        backgroundMode: one-shot
        maxDepth: provider-managed

    - id: tool-subagent-claude-code
      name: '@deepseek-ai/dsh-tool-subagent'
      disabled: true
      config:
        provider: claude-code
        toolName: subagent_claude_code
        backgroundMode: one-shot
        maxDepth: provider-managed

    - id: workflow-worker-thread
      name: '@deepseek-ai/dsh-workflow-worker-thread'
      config:
        provider: spawn

    - id: tool-workflow
      name: '@deepseek-ai/dsh-tool-workflow'

    - id: tool-ralph
      name: '@deepseek-ai/dsh-tool-ralph'
      config:
        subagentProvider: spawn
        maxRounds: 64

# ── remaining model-facing rows ─────────────────────────────────────────────

- id: tool-ask-user
  name: '@deepseek-ai/dsh-tool-ask-user'

- id: tool-todo
  name: '@deepseek-ai/dsh-tool-todo'
  config:
    allowParallelInProgress: true

# The `web` service and its search provider stay in the host composition; only
# the model-facing tool is per-session.
- id: tool-web
  name: '@deepseek-ai/dsh-tool-web'
  config:
    fetch: true
    searchTimeoutMs: 60000

# ── presentation ────────────────────────────────────────────────────────────

# BOTH mode for this agent: the native tool catalog stays listed, and PTC mode's
# `run_code` composition surface runs beside it. The row waits for the host's
# `codeRuntime` rather than assuming it — a deployment that composes no
# TypeScript runtime fails this preset at mount, naming this id, instead of at
# the first request.
- id: tool-presentation
  name: '@deepseek-ai/dsh-agent-tool-presentation'
  config:
    mode: both
